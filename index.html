<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyrus Ndirangu | Executive CV Portfolio</title>
    <style>
        :root {
            --brand-primary: #0f172a;
            --brand-accent: #2563eb;
            --brand-success: #10b981;
            --slate-dark: #1e293b;
            --slate-light: #f8fafc;
            --slate-border: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: #f1f5f9;
            padding: 3rem 1rem;
        }

        .cv-wrapper {
            max-width: 1050px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
            display: grid;
            grid-template-columns: 320px 1fr;
            overflow: hidden;
        }

        /* SIDEBAR SECTION */
        .sidebar {
            background-color: var(--brand-primary);
            color: white;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .profile-block h1 {
            font-size: 2.25rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: white;
        }

        .profile-block .tagline {
            color: #60a5fa;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 0.75rem;
            line-height: 1.3;
        }

        .sidebar-section h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #94a3b8;
            margin-bottom: 1rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
        }

        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            font-size: 0.9rem;
        }

        .contact-list li {
            display: flex;
            flex-direction: column;
        }

        .contact-list label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .contact-list a {
            color: #93c5fd;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact-list a:hover {
            color: white;
            text-decoration: underline;
        }

        .sidebar-skill-group {
            margin-bottom: 1.25rem;
        }

        .sidebar-skill-group h4 {
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .compact-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .compact-tags span {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #e2e8f0;
            font-weight: 500;
        }

        .sidebar-edu-item {
            margin-bottom: 1.25rem;
        }

        .sidebar-edu-item .degree {
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
        }

        .sidebar-edu-item .institution {
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .sidebar-edu-item .year {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* MAIN CONTENT SECTION */
        .main-content {
            padding: 4rem;
            background-color: white;
        }

        .main-section {
            margin-bottom: 3rem;
        }

        .main-section h2 {
            font-size: 1.35rem;
            color: var(--brand-primary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            border-bottom: 2px solid var(--slate-border);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .main-section h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--brand-accent);
            border-radius: 2px;
        }

        .executive-summary {
            font-size: 1.05rem;
            color: var(--text-main);
            text-align: justify;
            line-height: 1.7;
        }

        /* TIMELINE DISPLAY FOR WORK EXPERIENCE */
        .timeline {
            position: relative;
            padding-left: 1.5rem;
            border-left: 2px solid var(--slate-border);
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .timeline-item {
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: calc(-1.5rem - 6px);
            top: 0.35rem;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid var(--brand-accent);
            transition: background-color 0.2s ease;
        }

        .timeline-item:hover::before {
            background-color: var(--brand-accent);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .role-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--slate-dark);
        }

        .company-name {
            color: var(--brand-accent);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .job-date {
            font-size: 0.85rem;
            font-weight: 600;
            background-color: var(--slate-light);
            color: var(--text-muted);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            border: 1px solid var(--slate-border);
        }

        .timeline-item ul {
            padding-left: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .timeline-item li {
            font-size: 0.95rem;
            color: var(--text-main);
        }

        /* PREFERENCES CARD FOOTER */
        .pref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .pref-card {
            background-color: var(--slate-light);
            border: 1px solid var(--slate-border);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .pref-card strong {
            color: var(--slate-dark);
            display: block;
            margin-bottom: 0.25rem;
        }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width: 850px) {
            body { padding: 0; }
            .cv-wrapper { grid-template-columns: 1fr; border-radius: 0; }
            .sidebar { padding: 2.5rem 1.5rem; }
            .main-content { padding: 2.5rem 1.5rem; }
            .timeline-header { flex-direction: column; gap: 0.25rem; }
            .job-date { align-self: flex-start; margin-top: 0.25rem; }
        }

        /* PRINT CONFIGURATION */
        @media print {
            body { background: white; padding: 0; font-size: 12px; }
            .cv-wrapper { grid-template-columns: 240px 1fr; box-shadow: none; border-radius: 0; }
            .sidebar { background: #1e293b !important; padding: 1.5rem; }
            .main-content { padding: 2rem; }
            .compact-tags span { background: none !important; border: 1px solid #475569 !important; color: #1e293b !important; }
            .job-date { background: none !important; border: none; padding: 0; color: #1e293b !important; }
            .pref-card { background: none !important; border: 1px solid #cbd5e1; }
        }
    </style>
</head>
